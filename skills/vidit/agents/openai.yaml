interface:
  display_name: "Vidit"
  short_description: "Connect and edit local Vidit video projects"
  brand_color: "#7C3AED"
  icon_small: "./assets/vidit-icon.png"
  icon_large: "./assets/vidit-icon.png"
  default_prompt: "Use $vidit to connect to Vidit and inspect the selected video project."

dependencies:
  tools:
    - type: "mcp"
      value: "vidit"
      description: "Vidit local editor MCP server"
      transport: "streamable_http"
      url: "http://localhost:5199/api/external-mcp/mcp"

policy:
  allow_implicit_invocation: true
